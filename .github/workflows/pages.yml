name: deploy deck to pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: turn pages on if it is off, then configure it
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: package the repo root as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: publish
        id: deploy
        uses: actions/deploy-pages@v4
